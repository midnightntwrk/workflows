name: Drop status:untriaged on assign (reusable)

# Reusable: remove `status:untriaged` from an issue that has an assignee.
# Consumer dispatcher declares `on: issues: [assigned, labeled]` and
# `permissions: { issues: write }`, then calls this workflow via `uses:`.

on:
  workflow_call:

jobs:
  drop-untriaged:
    name: Remove status:untriaged from assigned issues
    runs-on: ubuntu-24.04
    # No `permissions:` block — reusable workflows inherit the consumer's,
    # which is the intended boundary for "what can this do in my repo".
    steps:
      - name: Remove status:untriaged if an assignee is present
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const assigned = (issue.assignees || []).length > 0;
            const hasUntriaged = (issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l.name))
              .filter(Boolean)
              .includes('status:untriaged');

            if (!assigned || !hasUntriaged) {
              core.info(`#${issue.number}: assigned=${assigned}, untriaged=${hasUntriaged} — nothing to do.`);
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'status:untriaged',
              });
              core.info(`Removed status:untriaged from assigned issue #${issue.number}.`);
            } catch (e) {
              if (e.status === 404) {
                core.info(`status:untriaged already gone from #${issue.number}.`);
              } else {
                throw e;
              }
            }
